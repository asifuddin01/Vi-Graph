# Tool configuration only. Dependencies live in requirements*.txt.

[tool.pytest.ini_options]
# `backend` on the path so code imports the app as `app.*`, matching how uvicorn runs
# it (`uvicorn app.main:app` from backend/); the repo root for `evaluation.*`.
pythonpath = ["backend", "."]
testpaths = ["backend/tests", "evaluation/tests", "data/tests", "training/tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend", "."]
# docs/SPEC.md is kept verbatim; ruff would otherwise reformat its code blocks. Notebooks
# are generated (training/notebooks/make_notebook.py) and checked by training/tests.
extend-exclude = ["frontend", "docs", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Notebook cell text (markdown tables, shell lines) lives in string literals there.
"training/notebooks/make_notebook.py" = ["E501"]
"training/notebooks/make_final_eval_notebook.py" = ["E501"]
